name = "fortbo"
version = "0.1.0"
description = "Differentiable Bayesian optimization for modern Fortran"
author = "lazy-fortran"
maintainer = "lazy-fortran"
license = "MIT"
copyright = "Copyright 2026 lazy-fortran"

[dependencies]
fortnum = { path = "../fortnum" }
fortopt = { path = "../fortopt" }
fortad = { path = "../fortad" }
fortml = { path = "../fortml" }

# FortSym is a generation-time tool. Generated kernels are committed or
# consumed through the FortSym CLI and are not a runtime Fortran dependency.

[build]
auto-tests = true

[fortran]
implicit-typing = false
source-form = "free"
